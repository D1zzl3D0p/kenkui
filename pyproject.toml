[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kenkui"
version = "10.0.0"
description = "Turn EPUB books into M4B audiobooks with local, multi-voice text-to-speech."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Kenkui contributors" }]
keywords = ["audiobook", "epub", "m4b", "pocket-tts", "text-to-speech", "tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
    "defusedxml==0.7.1",
    # Called directly with a model identifier from pipeline intent. No proxy
    # and no provider framework: see the character-casting design.
    "litellm>=1.0",
    # The pack declares a pocket-tts range and registry.py resolves against it.
    # packaging arrives transitively via huggingface-hub; Kenkui imports it
    # directly.
    "packaging>=24.0",
    "pocket-tts==2.1.0",
    # Provisioning rewrites pocket-tts config YAML to local paths. yaml arrives
    # transitively via pocket-tts, but Kenkui imports it directly.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Offline character inference: `infer_characters("spacy")`. Optional because the
# model roster is still the default and spaCy plus a pipeline is a large install
# for a caller who never selects it. A pipeline is a separate download:
#   python -m spacy download en_core_web_lg
spacy = ["spacy>=3.7,<4"]

[project.urls]
Homepage = "https://github.com/D1zzl3D0p/kenkui"
Documentation = "https://d1zzl3d0p.github.io/kenkui/"
Source = "https://github.com/D1zzl3D0p/kenkui"
Issues = "https://github.com/D1zzl3D0p/kenkui/issues"
Changelog = "https://github.com/D1zzl3D0p/kenkui/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "check-wheel-contents>=0.6.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "twine>=6.1",
  "types-defusedxml>=0.7.0.20250822",
  "types-pyyaml>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kenkui"]
artifacts = ["src/kenkui/_domain/spoken/data/*.json"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/docs",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/examples",
  "/mkdocs.yml",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Local evaluation and spike scratch, git-ignored and not part of the package.
extend-exclude = ["evals", "spikes"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/test_pocket_tts*.py" = [
  "ANN401", "D107", "E501", "FBT003", "PT012", "PT018", "RUF005",
  "RUF100", "S301", "TRY003",
]
"src/kenkui/_tts/pocket.py" = ["PLR2004", "RUF100"]
"src/kenkui/_tts/production.py" = ["TC001"]
"src/kenkui/_execution/process_pool.py" = ["PLC0415", "RUF100", "TRY301"]
"src/kenkui/__init__.py" = ["A004"]
"src/kenkui/api.py" = ["PLC0415"]
"src/kenkui/events.py" = ["A001"]
# Examples are scripts a reader copies: they print, narrow optionals with assert,
# show alternatives as commented-out calls, and live outside a package.
"examples/**/*.py" = ["EM101", "ERA001", "INP001", "S101", "T201", "TRY003"]

[tool.mypy]
# 3.12 rather than the 3.11 floor: numpy's stubs use PEP-695 `type` statements
# that mypy refuses to parse below 3.12, and the failure is at parse time, so
# no per-module override suppresses it (follow_imports = "skip" and
# ignore_missing_imports were both tried). numpy arrived transitively with the
# now-required pocket-tts. Cost: 3.11-specific type errors go unchecked, so
# keep 3.11 in the pytest CI matrix to cover the floor at runtime.
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

# pocket-tts ships no py.typed marker and no stubs. spaCy is an optional
# dependency, imported lazily only when callers select the offline roster path.
[[tool.mypy.overrides]]
module = ["pocket_tts.*", "spacy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=kenkui",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "-m=not native and not spacy",
]
markers = [
  "corpus: opt-in property test over the local Calibre library",
  "native: opt-in tests that execute host FFmpeg/ffprobe (requires KENKUI_RUN_NATIVE=1)",
  "pocket_real: opt-in strictly local Pocket-TTS test",
  "spacy: opt-in tests that need the spacy extra and the en_core_web_lg pipeline",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kenkui"]
# The offline roster needs the optional spaCy extra plus a ~400 MB pipeline
# download, so its tests are the opt-in `spacy` tier rather than part of the
# default offline gate. Run them with:
#   uv run --extra spacy python -m spacy download en_core_web_lg
#   uv run --extra spacy pytest --no-cov -m spacy
omit = ["*/kenkui/_characters/spacy_roster.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
