[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenkui"
version = "2.1.0"
description = "Convert Ebooks to Audiobooks with [custom] voice samples"
readme = "README.md"
authors = [{ name = "Sumner MacArthur", email = "spn1kolat3sla@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "beautifulsoup4>=4.14.0",
  "EbookLib>=0.20",
  "tomli-w>=1.0.0",
  "scipy>=1.17.0",
  "pydub>=0.25.0",
  "pocket-tts>=2.0.0",
  "mutagen>=1.45.0",
  "imageio-ffmpeg>=0.5.0",
  "mobi>=0.4.0",
  "spacy>=3.0.0",
  "ollama>=0.3.0",
  "booknlp>=1.0.8",
  "psutil>=5.9.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "setuptools>=40.0,<70",
  "pedalboard>=0.9",
  "noisereduce>=3.0",
  "ffmpeg-normalize>=1.26",
  "huggingface_hub>=1.3.0",
  "pymupdf>=1.24.0",
  "pymupdf_layout",
  "litellm>=1.0.0",
]

[project.scripts]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
pdf-enhanced = ["docling>=2.0"]

[project.urls]
"Homepage" = "https://github.com/D1zzl3D0p/kenkui"
"Bug Tracker" = "https://github.com/D1zzl3D0p/kenkui/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kenkui.samples" = ["*.epub", "*.pdf"]

[tool.setuptools.exclude-package-data]
"*" = ["*.wav", "*.safetensors", "*.pt", "*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
  "E501",   # line too long — handled by formatter / not enforced
  "E402",   # module-level import not at top — intentional in several modules
  "N806",   # variable in function should be lowercase — Windows constants
  "SIM105", # use contextlib.suppress — try/except pass is clearer at module level
  "SIM103", # explicit branching is clearer in predicate helpers
  "SIM108", # use ternary operator — sometimes if/else is more readable
  "B007",   # loop variable not used — some loop patterns are intentional
  "B904",   # exception chaining cleanup is tracked separately from this refactor
  "B905",   # existing zip() call sites predate strict= and need behavioral review
  "N813",   # third-party CamelCase aliases are used only for availability checks
  "UP042",  # StrEnum migration is a compatibility cleanup, not a refactor prerequisite
  "UP047",  # PEP 695 generic syntax would drop support for type checkers still in use
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "B017",   # broad exception assertions intentionally cover optional dependency failures
  "E741",   # short fixture-local names in string-formatting tests
  "F841",   # some mock bindings document patched collaborators without assertions
  "SIM117", # nested with-statements are often clearer in long mock stacks
]

[tool.ruff.lint.isort]
known-first-party = ["kenkui"]
