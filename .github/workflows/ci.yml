name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Verify dependency lock
        run: uv lock --check
      - name: Sync all locked dependency groups
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy
      - name: Tests with branch coverage >= 90%
        run: uv run pytest
      - name: Strict documentation
        run: uv run mkdocs build --strict

  native-ffmpeg:
    name: Native FFmpeg / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Check native tools and AAC encoder
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep -q ' aac '
      - name: Sync locked test environment
        run: |
          uv lock --check
          uv sync --frozen --all-groups
      - name: Native generated-audio acceptance
        run: KENKUI_RUN_NATIVE=1 uv run pytest --no-cov -m native tests/test_native_ffmpeg.py

  distribution:
    name: Build, archives, and isolated wheel smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync locked build environment
        run: |
          uv lock --check
          uv sync --frozen --all-groups
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata and wheel layout
        run: |
          uv run twine check dist/*
          uv run check-wheel-contents dist/*.whl
      - name: Inspect exact archive policy
        run: |
          uv run python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = {item.name for item in archive.getmembers()}

          forbidden = {
              "tests", "tmp", "build", "site", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", ".git", ".env", "htmlcov", "spikes",
          }
          def forbidden_name(name: str) -> bool:
              item_parts = PurePosixPath(name).parts
              return (
                  bool(forbidden.intersection(item_parts))
                  or any(part.startswith(".venv") for part in item_parts)
                  or any(part.lower() in {"credentials", "secrets", "token"}
                         for part in item_parts)
              )

          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              bad = sorted(name for name in names if forbidden_name(name))
              assert not bad, f"{label} forbidden entries: {bad}"

          assert "kenkui/py.typed" in wheel_names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in wheel_names)
          assert any(name.endswith(".dist-info/licenses/NOTICE") for name in wheel_names)
          required_sdist_suffixes = {
              "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/NOTICE",
              "/examples/02_quickstart.py",
              "/mkdocs.yml", "/pyproject.toml", "/uv.lock",
              "/docs/usage.md", "/docs/security.md", "/docs/pocket-tts-adapter.md",
              "/src/kenkui/py.typed",
          }
          for suffix in required_sdist_suffixes:
              assert any(name.endswith(suffix) for name in sdist_names), suffix
          print(f"wheel entries: {len(wheel_names)}; sdist entries: {len(sdist_names)}")
          PY
      - name: Isolated installed-wheel public API smoke
        run: |
          smoke="$(mktemp -d)"
          uv venv --python 3.11 --seed "$smoke/venv"
          uv pip install --python "$smoke/venv/bin/python" dist/*.whl
          cd "$smoke"
          "$smoke/venv/bin/python" - <<'PY'
          from pathlib import Path
          import zipfile
          import kenkui as kk

          source = Path("smoke.epub")
          container = """<?xml version="1.0"?>
          <container xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
            <rootfiles><rootfile full-path="content.opf"/></rootfiles>
          </container>"""
          package = """<?xml version="1.0"?>
          <package xmlns="http://www.idpf.org/2007/opf">
            <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
              <dc:title>Wheel Smoke</dc:title><dc:creator>Kenkui</dc:creator>
            </metadata>
            <manifest><item id="c" href="chapter.xhtml"/></manifest>
            <spine><itemref idref="c"/></spine>
          </package>"""
          chapter = """<html xmlns="http://www.w3.org/1999/xhtml">
          <head><title>One</title></head><body><h1>One</h1><p>Installed wheel.</p></body>
          </html>"""
          with zipfile.ZipFile(source, "w") as archive:
              archive.writestr("mimetype", "application/epub+zip", compress_type=zipfile.ZIP_STORED)
              archive.writestr("META-INF/container.xml", container)
              archive.writestr("content.opf", package)
              archive.writestr("chapter.xhtml", chapter)

          pipeline = kk.epub(source).assign_voice("smoke").tts()
          assert pipeline.validate().is_valid
          inspection = pipeline.inspect()
          assert inspection.metadata.title == "Wheel Smoke"
          assert len(inspection.chapters) == 1
          try:
              pipeline.write_m4b("smoke.m4b")
          except kk.RenderError as error:
              assert error.code is kk.ErrorCode.RENDERER_UNAVAILABLE
          else:
              raise AssertionError("rendering without provisioned voices did not fail")
          assert not Path("smoke.m4b").exists()
          print(kk.__version__, inspection.chapters[0].title)
          PY
