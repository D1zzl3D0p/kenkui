site_name: Kenkui
site_description: Turn EPUB books into M4B audiobooks with local, multi-voice text-to-speech.
site_url: https://d1zzl3d0p.github.io/kenkui/
repo_url: https://github.com/D1zzl3D0p/kenkui
repo_name: D1zzl3D0p/kenkui
edit_uri: edit/main/docs/
strict: true
# Local, unversioned agent planning notes must never reach the published site.
exclude_docs: |
  /superpowers/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Using Kenkui:
      - Getting started: getting-started.md
      - Installation: installation.md
      - Guide: usage.md
      - API reference: api.md
      - Models and voices: models-and-voices.md
      - Troubleshooting: troubleshooting.md
  - Internals:
      - Architecture: architecture.md
      - Security boundaries: security.md
      - Pocket-TTS adapter: pocket-tts-adapter.md
  - Project:
      - Development and releases: development.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
